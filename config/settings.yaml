# TARS Master Configuration File

assistant:
  name: "TARS"
  callsign: "TARS"
  version: "1.0.0"

personality:
  humor: 0.75          # Scale: 0.0 (deadpan) to 1.0 (roast master)
  honesty: 0.90        # Scale: 0.0 (diplomatic) to 1.0 (blunt truth)
  sarcasm: 0.60        # Scale: 0.0 (literal) to 1.0 (sharp wit)
  conciseness: true    # Keep spoken answers under 2 sentences unless requested
llm:
  provider: "groq"   # Options: "groq" | "nvidia"
  model: "openai/gpt-oss-20b"  # Groq
  fallback_models: ["nvidia/nemotron-3.5-lightning-30b-a3b"]
  temperature: 0.3
  max_output_tokens: 2048

voice:
  enabled: true
  tts_engine: "edge-tts"
  voice_name: "en-US-JennyNeural" # Friendly, warm female assistant voice
  rate: "+5%"
  volume: "+0%"
  stt_engine: "auto"             # Options: "auto" (Groq Whisper -> faster-whisper -> Google) | "groq" | "whisper" | "google"
  stt_energy_threshold: 250
  stt_pause_threshold: 0.35      # Pause length (in seconds) to wait before considering speech finished
  stt_timeout: 8
  stt_phrase_time_limit: 10      # Maximum duration of a spoken phrase

execution:
  powershell_timeout_seconds: 30
  auto_focus_window: true
  enable_browser_headless: false
  safety_strict_mode: true
