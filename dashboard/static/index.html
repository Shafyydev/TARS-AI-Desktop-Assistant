<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>T.A.R.S — Holographic Neural Interface</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='26' fill='%2304191e' stroke='%231ef5d8' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='10' fill='%23a7fff2'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg-core: #04191e;
      --bg-void: #010407;
      --holo: #1ef5d8;
      --holo-rgb: 30, 245, 216;
      --holo-bright: #a7fff2;
      --holo-bright-rgb: 167, 255, 242;
      --holo-sky: #3bd4ff;
      --holo-dim: rgba(var(--holo-rgb), 0.45);
      --holo-line: rgba(var(--holo-rgb), 0.28);
      --glass-bg: rgba(3, 15, 20, 0.62);
      --glass-strong: rgba(4, 18, 24, 0.88);
      --text: #e6fffb;
      --muted: rgba(var(--holo-bright-rgb), 0.64);
      --green: #3ef2a8;
      --amber: #ffd166;
      --red: #ff5d7a;
    }

    * { box-sizing: border-box; user-select: none; }
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background: radial-gradient(circle at 50% 47%, var(--bg-core) 0%, #020b10 42%, var(--bg-void) 100%);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    }

    /* Fullscreen 3D WebGL Stage */
    #orbCanvas {
      position: fixed; inset: 0; width: 100vw; height: 100vh; display: block;
      z-index: 1; cursor: grab; touch-action: none;
    }
    #orbCanvas:active { cursor: grabbing; }

    /* Optical HUD Scanline & Radial Vignette Overlays */
    .vignette-layer {
      position: fixed; inset: 0; z-index: 2; pointer-events: none;
      background:
        radial-gradient(circle at 50% 47%, transparent 32%, rgba(0, 0, 0, 0.56) 100%),
        repeating-linear-gradient(
          to bottom,
          rgba(var(--holo-rgb), 0.02) 0px,
          rgba(var(--holo-rgb), 0.02) 1px,
          transparent 1px,
          transparent 4px
        );
    }

    /* Shared Luxurious Reactive Hologram Button System */
    .holo-btn {
      position: relative; overflow: hidden; isolation: isolate;
      transition:
        transform .22s cubic-bezier(0.22, 1, 0.36, 1),
        border-color .22s ease,
        box-shadow .24s ease,
        background .24s ease,
        color .2s ease;
    }
    .holo-btn::before {
      content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
      opacity: 0; transition: opacity .25s ease;
      background: radial-gradient(
        110px circle at var(--mx, 50%) var(--my, 50%),
        rgba(var(--holo-bright-rgb), 0.30),
        rgba(var(--holo-rgb), 0.08) 55%,
        transparent 80%
      );
    }
    .holo-btn::after {
      content: ""; position: absolute; top: -40%; left: -120%; width: 70%; height: 180%;
      pointer-events: none; z-index: 0; transform: skewX(-24deg);
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.24), transparent);
      transition: left .55s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .holo-btn:hover::before { opacity: 1; }
    .holo-btn:hover::after { left: 155%; }
    .holo-btn:hover { transform: translateY(-1px) scale(1.02); }
    .holo-btn:active { transform: translateY(0) scale(0.95); }
    .holo-btn > * { position: relative; z-index: 1; }

    .btn-wave {
      position: absolute; border-radius: 50%; pointer-events: none; z-index: 0;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.65) 0%, rgba(var(--holo-rgb), 0.38) 45%, transparent 72%);
      transform: translate(-50%, -50%) scale(0);
      animation: btnWaveExpand .55s cubic-bezier(0.18, 0.85, 0.32, 1) forwards;
    }
    @keyframes btnWaveExpand {
      to { transform: translate(-50%, -50%) scale(2.8); opacity: 0; }
    }

    /* HUD Grid Overlay */
    .hud-layer {
      position: fixed; inset: 0; z-index: 4; pointer-events: none;
      padding: 20px 26px;
    }

    /* Top Header */
    .hud-top {
      display: flex; align-items: flex-start; justify-content: space-between;
    }
    .brand-block {
      pointer-events: auto;
      display: inline-flex; flex-direction: column; align-items: center; text-align: center;
    }
    .brand-title {
      font-size: 21px; font-weight: 600; letter-spacing: 0.44em; padding-left: 0.44em;
      color: var(--holo-bright);
      text-shadow: 0 0 18px rgba(var(--holo-rgb), 0.58);
    }
    .brand-sub {
      margin-top: 6px; font-size: 9.5px; letter-spacing: 0.20em; padding-left: 0.20em;
      text-transform: uppercase; color: var(--muted); font-family: Consolas, ui-monospace, monospace;
    }
    .brand-bar {
      margin-top: 8px; width: 100%; height: 1px;
      background: linear-gradient(90deg, transparent, var(--holo), transparent);
    }

    /* Top-Center Clean Unboxed Clock */
    .top-clock {
      position: fixed; left: 50%; top: 24px; transform: translateX(-50%);
      pointer-events: none; z-index: 5;
      font-family: Consolas, ui-monospace, monospace;
      font-size: 13px; font-variant-numeric: tabular-nums;
      letter-spacing: 0.24em; padding-left: 0.24em;
      color: var(--holo-bright);
      text-shadow: 0 0 12px rgba(var(--holo-rgb), 0.48);
    }

    .top-right {
      display: inline-flex; align-items: center; gap: 10px;
      pointer-events: auto;
    }

    /* Reference-Matched Silky Directional Glow Obsidian Glass Pills */
    .jewel-pill {
      --pill-rgb: var(--holo-rgb);
      --pill-bright-rgb: var(--holo-bright-rgb);
      --pill-text: var(--holo-bright);
      --ico-color: var(--holo-bright);
      --bloom-alpha: 0.40;
      height: 36px;
      display: inline-flex; align-items: center; justify-content: center; gap: 9px;
      padding: 0 16px 0 11px;
      border-radius: 999px;
      border: 0;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      font-size: 13px; font-weight: 500; letter-spacing: 0.01em;
      color: var(--pill-text);
      cursor: pointer;
      background:
        radial-gradient(76% 42% at 50% 0%, rgba(255, 255, 255, 0.11), transparent 72%),
        radial-gradient(120% 145% at 88% 72%, rgba(var(--pill-rgb), var(--bloom-alpha)) 0%, rgba(var(--pill-rgb), 0.14) 44%, rgba(10, 13, 18, 0.86) 80%);
      backdrop-filter: blur(18px) saturate(140%);
      box-shadow:
        0 8px 22px rgba(0, 0, 0, 0.48),
        6px 2px 22px -6px rgba(var(--pill-rgb), 0.44),
        inset 0 1px 0 rgba(255, 255, 255, 0.13);
    }
    .jewel-pill .pill-rim {
      position: absolute; inset: 0; border-radius: inherit; padding: 1.5px;
      pointer-events: none; z-index: 2;
      background: linear-gradient(
        132deg,
        rgba(255, 255, 255, 0.16) 0%,
        rgba(var(--pill-rgb), 0.14) 38%,
        rgba(var(--pill-rgb), 0.72) 74%,
        rgba(var(--pill-bright-rgb), 0.95) 100%
      );
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask-composite: exclude;
      transition: opacity .24s ease;
    }
    .jewel-pill:hover {
      --bloom-alpha: 0.56;
      color: #ffffff;
      box-shadow:
        0 10px 28px rgba(0, 0, 0, 0.54),
        6px 2px 28px -3px rgba(var(--pill-rgb), 0.65),
        inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }
    .jewel-pill .pill-ico {
      width: 17px; height: 17px; display: inline-flex; align-items: center; justify-content: center;
      flex-shrink: 0; color: var(--ico-color);
      filter: drop-shadow(0 0 6px rgba(var(--pill-rgb), 0.55));
      transition: transform .24s cubic-bezier(0.22, 1, 0.36, 1), filter .24s ease;
    }
    .jewel-pill .pill-ico svg { width: 17px; height: 17px; display: block; }
    .jewel-pill:hover .pill-ico {
      transform: scale(1.07);
      filter: drop-shadow(0 0 9px rgba(var(--pill-bright-rgb), 0.85));
    }

    /* Voice Status Pill Color & Activity States */
    .status-chip.state-idle:not(.is-muted) {
      --pill-rgb: 54, 224, 138;
      --pill-bright-rgb: 148, 255, 198;
      --pill-text: #94f7c1;
      --ico-color: #62ef9e;
      --bloom-alpha: 0.38;
    }
    .status-chip.state-listening,
    .status-chip.state-speaking {
      --pill-rgb: var(--holo-rgb);
      --pill-bright-rgb: var(--holo-bright-rgb);
      --pill-text: var(--holo-bright);
      --ico-color: var(--holo-bright);
      --bloom-alpha: 0.48;
    }
    .status-chip.state-listening .pill-ico,
    .status-chip.state-speaking .pill-ico {
      animation: jewelPulse 1.7s ease-in-out infinite;
    }
    @keyframes jewelPulse {
      0%, 100% { filter: drop-shadow(0 0 5px rgba(var(--pill-rgb), 0.55)); transform: scale(1); }
      50% { filter: drop-shadow(0 0 11px rgba(var(--pill-bright-rgb), 0.95)); transform: scale(1.08); }
    }
    .status-chip.state-thinking {
      --pill-rgb: 242, 194, 62;
      --pill-bright-rgb: 255, 232, 148;
      --pill-text: #ffe48a;
      --ico-color: #ffd55a;
      --bloom-alpha: 0.44;
    }
    .status-chip.state-error {
      --pill-rgb: 242, 96, 114;
      --pill-bright-rgb: 255, 172, 184;
      --pill-text: #ffb8c2;
      --ico-color: #ff8e9c;
      --bloom-alpha: 0.42;
    }
    .status-chip.is-muted {
      --pill-rgb: 168, 178, 192;
      --pill-bright-rgb: 222, 228, 236;
      --pill-text: #d6dde6;
      --ico-color: #c2cad4;
      --bloom-alpha: 0.28;
    }
    .status-chip.is-muted:hover { --bloom-alpha: 0.42; }

    /* Theme-Matched Inspector Pill */
    .inspector-node.active {
      --bloom-alpha: 0.58;
      color: #ffffff;
      box-shadow:
        0 10px 28px rgba(0, 0, 0, 0.54),
        6px 2px 28px -2px rgba(var(--holo-rgb), 0.68),
        inset 0 1px 0 rgba(255, 255, 255, 0.24);
    }

    /* Soft Coral-Rose Glass Abort Pill */
    .abort-node {
      --pill-rgb: 240, 96, 114;
      --pill-bright-rgb: 255, 172, 182;
      --pill-text: #ffb9c2;
      --ico-color: #ff8d9b;
      --bloom-alpha: 0.36;
    }
    .abort-node::before {
      background: radial-gradient(110px circle at var(--mx, 50%) var(--my, 50%), rgba(255, 130, 150, 0.32), transparent 76%);
    }

    .mini-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: linear-gradient(180deg, rgba(var(--holo-bright-rgb), 0.12), rgba(4, 18, 24, 0.74));
      backdrop-filter: blur(12px);
      border: 1px solid rgba(var(--holo-rgb), 0.34); color: var(--holo-bright);
      border-radius: 999px; padding: 6px 12px; font-size: 10.5px;
      font-family: Consolas, ui-monospace, monospace; letter-spacing: 0.12em;
      cursor: pointer;
      box-shadow: 0 0 14px rgba(var(--holo-rgb), 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }
    .mini-btn:hover {
      border-color: var(--holo);
      box-shadow: 0 0 22px rgba(var(--holo-rgb), 0.38), inset 0 0 12px rgba(var(--holo-rgb), 0.16);
      color: #ffffff;
    }
    .mini-btn.danger {
      background: linear-gradient(180deg, rgba(255, 93, 122, 0.14), rgba(22, 8, 14, 0.74));
      border-color: rgba(255, 93, 122, 0.44); color: #ffc8d3;
      box-shadow: 0 0 14px rgba(255, 93, 122, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.10);
    }
    .mini-btn.danger:hover {
      border-color: var(--red); color: #ffffff;
      box-shadow: 0 0 24px rgba(255, 93, 122, 0.45), inset 0 0 14px rgba(255, 93, 122, 0.22);
    }
    .mini-btn.danger::before {
      background: radial-gradient(110px circle at var(--mx, 50%) var(--my, 50%), rgba(255, 130, 155, 0.32), transparent 75%);
    }

    /* Left Translucent Diagnostic Feed */
    .left-stream {
      position: fixed; left: 28px; top: 96px; width: 258px;
      display: flex; flex-direction: column; gap: 6px;
      overflow: hidden; pointer-events: auto;
      font-family: Consolas, ui-monospace, monospace;
    }
    .stream-section-title {
      font-size: 9px; letter-spacing: 0.24em; text-transform: uppercase;
      color: var(--holo-dim); margin: 10px 0 3px;
      display: flex; align-items: center; gap: 8px;
    }
    .stream-section-title::after {
      content: ""; flex: 1; height: 1px;
      background: linear-gradient(90deg, rgba(var(--holo-rgb), 0.30), transparent);
    }
    .diag-line {
      display: flex; align-items: center; gap: 8px;
      font-size: 11px; line-height: 1.38; color: rgba(var(--holo-bright-rgb), 0.82);
      text-shadow: 0 0 8px rgba(var(--holo-rgb), 0.20);
      transition: color .2s ease, transform .2s ease;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .diag-line:hover { color: #ffffff; transform: translateX(3px); }
    .diag-dot {
      width: 4px; height: 4px; border-radius: 50%; flex-shrink: 0;
      background: var(--holo); box-shadow: 0 0 6px var(--holo);
    }
    .diag-dot.ok { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .diag-dot.fail { background: var(--red); box-shadow: 0 0 6px var(--red); }
    .diag-k { color: var(--muted); flex-shrink: 0; }
    .diag-v { color: var(--holo-bright); font-weight: 600; margin-left: auto; }
    .diag-bar-wrap {
      width: 56px; height: 3px; background: rgba(var(--holo-rgb), 0.14);
      border-radius: 2px; overflow: hidden; margin-left: auto; flex-shrink: 0;
    }
    .diag-bar-fill {
      height: 100%; background: linear-gradient(90deg, var(--holo), var(--holo-bright));
      box-shadow: 0 0 8px var(--holo); transition: width .5s ease;
    }

    .btn-svg { width: 13px; height: 13px; flex-shrink: 0; filter: drop-shadow(0 0 5px rgba(var(--holo-rgb), 0.55)); }
    @keyframes dockPulse { 0%, 100% { box-shadow: 0 0 12px rgba(255, 93, 122, 0.45); } 50% { box-shadow: 0 0 26px rgba(255, 93, 122, 0.90); } }

    .drawer-theme-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 7px 9px; border-radius: 5px;
      background: rgba(var(--holo-rgb), 0.06);
      border: 1px solid rgba(var(--holo-rgb), 0.22);
    }
    .drawer-theme-label {
      font-family: Consolas, ui-monospace, monospace; font-size: 10px;
      letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted);
    }
    .palette-row {
      display: flex; align-items: center; gap: 8px;
    }
    .swatch {
      width: 17px; height: 17px; border-radius: 50%; cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.38);
      transition: transform .2s cubic-bezier(0.22, 1, 0.36, 1), box-shadow .2s ease;
    }
    .swatch:hover, .swatch.active { transform: scale(1.26); box-shadow: 0 0 14px currentColor; border-color: #ffffff; }

    /* Orb Interactive Guide Hint */
    .orb-hint {
      position: fixed; left: 50%; top: 13%; transform: translateX(-50%);
      font-family: Consolas, ui-monospace, monospace; font-size: 10px;
      letter-spacing: 0.22em; text-transform: uppercase;
      color: rgba(var(--holo-bright-rgb), 0.46); pointer-events: none;
      text-shadow: 0 0 10px rgba(var(--holo-rgb), 0.25);
      transition: opacity .6s ease;
    }

    /* Bottom-Center Floating Subtitles + Luxurious Reactive Command Bar */
    .center-bottom {
      position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
      width: min(690px, calc(100vw - 440px)); min-width: 340px;
      display: flex; flex-direction: column; align-items: stretch; gap: 10px;
      pointer-events: auto;
    }
    .subtitles-stream {
      display: flex; flex-direction: column; gap: 6px;
      max-height: 145px; overflow-y: auto; padding: 4px 10px;
      mask-image: linear-gradient(to bottom, transparent 0%, black 22%, black 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 22%, black 100%);
      scrollbar-width: none;
    }
    .subtitles-stream::-webkit-scrollbar { display: none; }
    .sub-line {
      text-align: center; font-size: 12.5px; line-height: 1.42;
      color: rgba(235, 255, 252, 0.94);
      text-shadow: 0 0 12px rgba(var(--holo-rgb), 0.35), 0 1px 4px rgba(0, 0, 0, 0.92);
      user-select: text; animation: fadeRise .28s ease;
    }
    .sub-line.user { color: var(--holo-bright); font-size: 11.5px; }
    .sub-line .sub-tag {
      font-family: Consolas, ui-monospace, monospace; font-size: 10px;
      letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--holo); margin-right: 6px; opacity: 0.88;
    }
    @keyframes fadeRise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .composer-glass {
      display: flex; align-items: center; gap: 9px; padding: 6px 8px 6px 16px;
      background: linear-gradient(145deg, rgba(var(--holo-rgb), 0.08), rgba(3, 15, 20, 0.78));
      backdrop-filter: blur(18px);
      border: 1px solid rgba(var(--holo-rgb), 0.38); border-radius: 999px;
      box-shadow: 0 0 32px rgba(var(--holo-rgb), 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.08), inset 0 0 18px rgba(var(--holo-rgb), 0.06);
      transition: border-color .22s ease, box-shadow .22s ease;
    }
    .composer-glass:focus-within {
      border-color: var(--holo);
      box-shadow: 0 0 38px rgba(var(--holo-rgb), 0.30), inset 0 1px 0 rgba(255, 255, 255, 0.14), inset 0 0 20px rgba(var(--holo-rgb), 0.12);
    }
    .composer-glass input {
      flex: 1; background: transparent; border: none; outline: none;
      color: #ffffff; font-size: 13.5px; user-select: text;
    }
    .composer-glass input::placeholder { color: rgba(var(--holo-bright-rgb), 0.46); }

    .orb-icon-btn {
      width: 38px; height: 38px; border-radius: 50%;
      border: 1px solid rgba(var(--holo-rgb), 0.38);
      background: linear-gradient(145deg, rgba(var(--holo-rgb), 0.18), rgba(6, 28, 36, 0.82));
      color: var(--holo-bright);
      cursor: pointer; display: grid; place-items: center;
      box-shadow: 0 0 14px rgba(var(--holo-rgb), 0.16), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }
    .orb-icon-btn svg {
      width: 17px; height: 17px;
      filter: drop-shadow(0 0 6px rgba(var(--holo-rgb), 0.65));
      transition: transform .22s ease, filter .22s ease;
    }
    .orb-icon-btn:hover {
      border-color: var(--holo-bright);
      background: linear-gradient(145deg, rgba(var(--holo-rgb), 0.32), rgba(8, 38, 48, 0.90));
      box-shadow: 0 0 22px rgba(var(--holo-rgb), 0.48), inset 0 0 12px rgba(var(--holo-rgb), 0.22);
      color: #ffffff;
    }
    .orb-icon-btn:hover svg { transform: scale(1.1); filter: drop-shadow(0 0 9px var(--holo)); }
    .orb-icon-btn.listening {
      background: linear-gradient(145deg, rgba(255, 72, 110, 0.45), rgba(110, 14, 34, 0.9));
      border-color: var(--red); color: #ffffff;
      animation: dockPulse 1.15s infinite;
    }
    .orb-icon-btn.listening::after { opacity: 0; }
    .mic-pulse-ring {
      position: absolute; inset: -4px; border-radius: 50%;
      border: 1.5px solid var(--red); opacity: 0; pointer-events: none;
    }
    .orb-icon-btn.listening .mic-pulse-ring { animation: micWaveRing 1.3s ease-out infinite; }
    @keyframes micWaveRing { 0% { transform: scale(0.92); opacity: 0.9; } 100% { transform: scale(1.48); opacity: 0; } }
    .orb-icon-btn.muted { opacity: 0.56; border-color: rgba(var(--holo-rgb), 0.20); }
    .orb-icon-btn #spkWaves { transition: opacity .2s ease; }
    .orb-icon-btn.muted #spkWaves { opacity: 0.15; }
    .orb-icon-btn #spkMuteBar { opacity: 0; transition: opacity .2s ease; }
    .orb-icon-btn.muted #spkMuteBar { opacity: 1; }

    .send-pill {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 9px 18px; border-radius: 999px;
      background: linear-gradient(135deg, rgba(var(--holo-rgb), 0.30), rgba(var(--holo-bright-rgb), 0.14));
      border: 1px solid rgba(var(--holo-rgb), 0.62);
      color: #ffffff; font-weight: 600; font-size: 11.5px; letter-spacing: 0.12em;
      text-transform: uppercase; cursor: pointer;
      box-shadow: 0 0 20px rgba(var(--holo-rgb), 0.24), inset 0 1px 0 rgba(255, 255, 255, 0.22);
    }
    .send-pill:hover {
      background: linear-gradient(135deg, rgba(var(--holo-rgb), 0.48), rgba(var(--holo-bright-rgb), 0.24));
      border-color: var(--holo-bright);
      box-shadow: 0 0 28px rgba(var(--holo-rgb), 0.56), inset 0 0 14px rgba(255, 255, 255, 0.18);
    }
    .send-pill:disabled { opacity: 0.42; cursor: not-allowed; transform: none; }

    /* Expandable Glass Popover Drawer (docked cleanly top-right) */
    .glass-drawer {
      position: fixed; right: 26px; top: 76px;
      width: min(410px, calc(100vw - 52px)); max-height: calc(100vh - 112px);
      background: var(--glass-strong); backdrop-filter: blur(20px);
      border: 1px solid rgba(var(--holo-rgb), 0.44);
      border-radius: 8px; padding: 14px 16px;
      box-shadow: 0 0 44px rgba(0, 0, 0, 0.82), 0 0 28px rgba(var(--holo-rgb), 0.18);
      z-index: 20; pointer-events: auto; display: none; flex-direction: column; gap: 10px;
    }
    .glass-drawer.open { display: flex; animation: fadeRise .2s ease; }
    .drawer-head {

<script>
const $ = (id) => document.getElementById(id);
function esc(s) {
  return (s == null ? "" : String(s)).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;" }[c]));
}

/* ==================== 3D INTERACTIVE HOLOGRAPHIC ORB ENGINE ==================== */
const THEMES = {
  aqua:   { primary: "#1ef5d8", rgb: "30, 245, 216", bright: "#a7fff2", brightRgb: "167, 255, 242", sky: "#3bd4ff", bgCore: "#04191e", p1: 0x1ef5d8, p2: 0x3bd4ff, p3: 0xd8fff9 },
  cobalt: { primary: "#3bb4ff", rgb: "59, 180, 255", bright: "#bfe6ff", brightRgb: "191, 230, 255", sky: "#6b7cff", bgCore: "#051428", p1: 0x3bb4ff, p2: 0x708dff, p3: 0xe6f4ff },
  gold:   { primary: "#ffcc4d", rgb: "255, 204, 77", bright: "#fff1be", brightRgb: "255, 241, 190", sky: "#ff8c42", bgCore: "#1c1304", p1: 0xffcc4d, p2: 0xff8c42, p3: 0xfff8dc },
  violet: { primary: "#b97cff", rgb: "185, 124, 255", bright: "#edd9ff", brightRgb: "237, 217, 255", sky: "#57d4ff", bgCore: "#130824", p1: 0xb97cff, p2: 0x57d4ff, p3: 0xf7ebff }
};

let orbState = "idle"; // "idle" | "listening" | "thinking" | "speaking" | "error"
let audioLevel = 0.0;
let ttsSpeakWave = 0.0;
let backendSpeakActive = false;
let backendSpeakLevel = 0.0;
let browserSpeaking = false;
let activeTheme = THEMES.aqua;

const HoloEngine = (() => {
  const canvas = $("orbCanvas");
  if (typeof THREE === "undefined" || !canvas) {
    return { setTheme: () => {}, pulse: () => {}, resetView: () => {} };
  }

  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: "high-performance" });
  } catch (e) {
    return { setTheme: () => {}, pulse: () => {}, resetView: () => {} };
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(46, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.set(0, 0, 4.45);
  let targetCamZ = 4.45;

  const holoRoot = new THREE.Group();
  scene.add(holoRoot);

  // Create soft radial bokeh glow texture programmatically
  function makeGlowTexture(inner, mid, outer) {
    const c = document.createElement("canvas");
    c.width = 256; c.height = 256;
    const ctx = c.getContext("2d");
    const g = ctx.createRadialGradient(128, 128, 2, 128, 128, 128);
    g.addColorStop(0.0, inner);
    g.addColorStop(0.28, mid);
    g.addColorStop(0.65, outer);
    g.addColorStop(1.0, "rgba(0,0,0,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 256, 256);
    return new THREE.CanvasTexture(c);
  }

  const coreTex = makeGlowTexture("rgba(255,255,255,1)", "rgba(180,255,246,0.78)", "rgba(30,245,216,0.14)");
  const haloTex = makeGlowTexture("rgba(45,255,228,0.58)", "rgba(25,215,198,0.24)", "rgba(10,120,130,0.03)");

  function makeFlareTexture() {
    const c = document.createElement("canvas");
    c.width = 512; c.height = 64;
    const ctx = c.getContext("2d");
    const hg = ctx.createLinearGradient(0, 32, 512, 32);
    hg.addColorStop(0.0, "rgba(0,0,0,0)");
    hg.addColorStop(0.28, "rgba(30,245,216,0.28)");
    hg.addColorStop(0.5, "rgba(235,255,252,0.95)");
    hg.addColorStop(0.72, "rgba(30,245,216,0.28)");
    hg.addColorStop(1.0, "rgba(0,0,0,0)");
    const vg = ctx.createLinearGradient(256, 0, 256, 64);
    vg.addColorStop(0.0, "rgba(0,0,0,0)");
    vg.addColorStop(0.45, "rgba(255,255,255,0.65)");
    vg.addColorStop(0.5, "rgba(255,255,255,1)");
    vg.addColorStop(0.55, "rgba(255,255,255,0.65)");
    vg.addColorStop(1.0, "rgba(0,0,0,0)");
    ctx.fillStyle = hg;
    ctx.fillRect(0, 0, 512, 64);
    ctx.globalCompositeOperation = "destination-in";
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, 512, 64);
    return new THREE.CanvasTexture(c);
  }

  // Layer 1: Inner White-Hot Core + Volumetric Halo
  const coreSprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: coreTex, color: 0xffffff, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
  }));
  coreSprite.scale.set(0.92, 0.92, 1);
  holoRoot.add(coreSprite);

  const haloSprite = new THREE.Sprite(new THREE.SpriteMaterial({
    map: haloTex, color: activeTheme.p1, transparent: true, opacity: 0.80, blending: THREE.AdditiveBlending, depthWrite: false
  }));
  haloSprite.scale.set(4.3, 4.3, 1);
  scene.add(haloSprite);

  // Soft optical anamorphic horizontal lens flare across core
  const flareMat = new THREE.SpriteMaterial({
    map: makeFlareTexture(), color: 0xd8fff9, transparent: true, opacity: 0.72,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const flareBeam = new THREE.Sprite(flareMat);
  flareBeam.scale.set(3.4, 0.24, 1);
  holoRoot.add(flareBeam);

  // Layer 2: Inner Geodesic Plasma Core Wireframe
  const innerLatticeMat = new THREE.MeshBasicMaterial({
    color: activeTheme.p3, wireframe: true, transparent: true, opacity: 0.24,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const innerLattice = new THREE.Mesh(new THREE.IcosahedronGeometry(0.62, 2), innerLatticeMat);
  holoRoot.add(innerLattice);

  // Layer 3: Mid Latitude-Longitude Hologram Sphere Cage
  const midCageMat = new THREE.MeshBasicMaterial({
    color: activeTheme.p1, wireframe: true, transparent: true, opacity: 0.18,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  const midCage = new THREE.Mesh(new THREE.SphereGeometry(0.94, 30, 18), midCageMat);
  holoRoot.add(midCage);

  // Layer 4: Counter-Rotating Multi-Axis Gyroscopic Orbital Rings + Orbiting Nodes
  const gyroRings = [];
  const ringConfigs = [
    { r: 0.78, tube: 0.0040, tilt: [0.45, 0.2, 0.0], speed: [0.008, 0.012, 0.004], col: activeTheme.p3, op: 0.62 },
    { r: 1.06, tube: 0.0050, tilt: [-0.85, 0.4, 0.2], speed: [-0.006, 0.009, -0.005], col: activeTheme.p1, op: 0.52 },
    { r: 1.32, tube: 0.0038, tilt: [1.18, -0.5, 0.3], speed: [0.004, -0.007, 0.006], col: activeTheme.p2, op: 0.44 },
    { r: 1.50, tube: 0.0030, tilt: [0.22, 1.05, -0.4], speed: [-0.003, -0.005, 0.008], col: activeTheme.p1, op: 0.30 }
  ];
  ringConfigs.forEach(cfg => {
    const grp = new THREE.Group();
    grp.rotation.set(cfg.tilt[0], cfg.tilt[1], cfg.tilt[2]);
    const mat = new THREE.MeshBasicMaterial({
      color: cfg.col, transparent: true, opacity: cfg.op,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    const mesh = new THREE.Mesh(new THREE.TorusGeometry(cfg.r, cfg.tube, 12, 160), mat);
    grp.add(mesh);

    const nodeMesh = new THREE.Mesh(
      new THREE.SphereGeometry(0.020, 12, 12),
      new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.92, blending: THREE.AdditiveBlending })
    );
    nodeMesh.position.set(cfg.r, 0, 0);
    grp.add(nodeMesh);
    holoRoot.add(grp);
    gyroRings.push({ grp, mat, speed: cfg.speed, baseOp: cfg.op });
  });

  // Layer 5: Outer Interactive Volumetric Fresnel Plasma Shell (Custom GLSL Shaders)
  const shellUniforms = {
    uTime:         { value: 0 },
    uAudio:        { value: 0 },
    uColorPrimary: { value: new THREE.Color(activeTheme.p1) },
    uColorAccent:  { value: new THREE.Color(activeTheme.p2) },
    uHoverPoint:   { value: new THREE.Vector3(0, 0, 1) },
    uHoverStrength:{ value: 0 },
    uRippleOrigin: { value: new THREE.Vector3(0, 0, 1) },
    uRippleTime:   { value: 99.0 }
  };

  const shellMat = new THREE.ShaderMaterial({
    uniforms: shellUniforms,
    transparent: true,
    depthWrite: false,
    side: THREE.FrontSide,
    blending: THREE.AdditiveBlending,
    vertexShader: `
      uniform float uTime;
      uniform float uAudio;
      uniform vec3 uHoverPoint;
      uniform float uHoverStrength;
      uniform vec3 uRippleOrigin;
      uniform float uRippleTime;
      varying vec3 vNormalView;
      varying vec3 vViewDir;
      varying vec3 vLocalPos;
      varying float vRippleWave;

      void main() {
        vec3 p = position;
        float w1 = sin(p.x * 4.2 + uTime * 2.1) * cos(p.y * 4.5 - uTime * 1.7) * sin(p.z * 3.8 + uTime * 1.3);
        float w2 = cos((p.y + p.z) * 7.5 - uTime * 3.1) * 0.45;
        float vocalBand = sin(p.y * 8.0 - uTime * 8.5) * uAudio * 0.025;
        float disp = (w1 + w2) * (0.008 + uAudio * 0.125) + vocalBand;

        vec3 nPos = normalize(p);
        float hDist = distance(nPos, normalize(uHoverPoint));
        float hBump = exp(-hDist * hDist * 8.0) * uHoverStrength * 0.085;

        float rDist = distance(nPos, normalize(uRippleOrigin));
        float front = uRippleTime * 2.5;
        float rEnv = exp(-pow((rDist - front) * 7.5, 2.0)) * exp(-uRippleTime * 1.8);
        float rippleDisp = sin((rDist - front) * 20.0) * rEnv * 0.075;
        vRippleWave = rEnv;

        p += normal * (disp + hBump + rippleDisp);
        vLocalPos = p;

        vec4 mvPos = modelViewMatrix * vec4(p, 1.0);
        vNormalView = normalize(normalMatrix * normal);
        vViewDir = normalize(-mvPos.xyz);
        gl_Position = projectionMatrix * mvPos;
      }
    `,
    fragmentShader: `
      uniform float uTime;
      uniform float uAudio;
      uniform vec3 uColorPrimary;
      uniform vec3 uColorAccent;
      uniform float uHoverStrength;
      varying vec3 vNormalView;
      varying vec3 vViewDir;
      varying vec3 vLocalPos;
      varying float vRippleWave;

      void main() {
        float ndotv = abs(dot(normalize(vNormalView), normalize(vViewDir)));
        float fresnel = pow(1.0 - clamp(ndotv, 0.0, 1.0), 2.8);
        float crispRim = pow(1.0 - clamp(ndotv, 0.0, 1.0), 6.5);

        float bands = 0.5 + 0.5 * sin(vLocalPos.y * 12.0 - uTime * 2.4 + sin(vLocalPos.x * 6.0) * 1.2);
        vec3 col = mix(uColorPrimary, uColorAccent, clamp(bands * 0.55 + uAudio * 0.25, 0.0, 1.0));
        col += vec3(0.85, 1.0, 0.98) * (crispRim * 0.65 + vRippleWave * 1.25);

        float alpha = fresnel * (0.56 + uAudio * 0.22 + uHoverStrength * 0.14)
                    + crispRim * 0.36
                    + vRippleWave * 0.48;
        gl_FragColor = vec4(col, clamp(alpha, 0.0, 0.78));
      }
    `
  });
  const outerShell = new THREE.Mesh(new THREE.SphereGeometry(1.28, 96, 96), shellMat);
  holoRoot.add(outerShell);

  // Layer 6: Feathered Laser Touch Shockwave Ring (Shader-driven crisp halo, never flat solid geometry)
  const shockUniforms = {
    uColor:   { value: new THREE.Color(activeTheme.p3) },
    uOpacity: { value: 0.0 }
  };
  const shockRingMat = new THREE.ShaderMaterial({
    uniforms: shockUniforms,
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending,
    vertexShader: `
      varying vec2 vUv;
      void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
    `,
    fragmentShader: `
      uniform vec3 uColor;
      uniform float uOpacity;
      varying vec2 vUv;
      void main() {
        float radial = length(vUv - vec2(0.5)) * 2.0;
        float band = exp(-pow((radial - 0.88) * 16.0, 2.0));
        gl_FragColor = vec4(uColor, band * uOpacity);
      }
    `
  });
  const shockRing = new THREE.Mesh(new THREE.PlaneGeometry(2.75, 2.75), shockRingMat);
  holoRoot.add(shockRing);
  let shockAnim = 99.0;

  // Invisible smooth raycast collider for accurate hover/click/drag on sphere
  const hitCollider = new THREE.Mesh(
    new THREE.SphereGeometry(1.48, 24, 24),
    new THREE.MeshBasicMaterial({ visible: false })
  );
  holoRoot.add(hitCollider);

  // Layer 7: Dense Volumetric 3D Bokeh Particle Galaxy (5,200 Custom Shader Points)
  const P_COUNT = 5200;
  const pPos = new Float32Array(P_COUNT * 3);
  const pSeed = new Float32Array(P_COUNT);
  const pSize = new Float32Array(P_COUNT);
  const pColorMix = new Float32Array(P_COUNT);

  for (let i = 0; i < P_COUNT; i++) {
    const u = Math.random();
    // Rich orbital halo bursting around sphere (r 1.25..2.75) + swirling core & outer nebula
    const r = u < 0.20
      ? (0.32 + Math.random() * 0.96)
      : (u < 0.78 ? (1.26 + Math.pow(Math.random(), 1.25) * 1.48) : (2.45 + Math.random() * 2.35));
    const theta = Math.random() * Math.PI * 2.0;
    const phi = Math.acos(2.0 * Math.random() - 1.0);
    pPos[i * 3 + 0] = r * Math.sin(phi) * Math.cos(theta);
    pPos[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta) * (u < 0.20 ? 1.0 : 0.86);
    pPos[i * 3 + 2] = r * Math.cos(phi);
    pSeed[i] = Math.random() * 100.0;
    pSize[i] = u < 0.78 ? (2.6 + Math.random() * 5.2) : (1.8 + Math.random() * 4.2);
    pColorMix[i] = Math.random();
  }
  const pGeo = new THREE.BufferGeometry();
  pGeo.setAttribute("position", new THREE.BufferAttribute(pPos, 3));
  pGeo.setAttribute("aSeed", new THREE.BufferAttribute(pSeed, 1));
  pGeo.setAttribute("aSize", new THREE.BufferAttribute(pSize, 1));
  pGeo.setAttribute("aMix", new THREE.BufferAttribute(pColorMix, 1));

  const pUniforms = {
    uTime:         { value: 0 },
    uAudio:        { value: 0 },
    uPixelRatio:   { value: Math.min(window.devicePixelRatio || 1, 2) },
    uColorPrimary: { value: new THREE.Color(activeTheme.p1) },
    uColorAccent:  { value: new THREE.Color(activeTheme.p2) },
    uColorCore:    { value: new THREE.Color(activeTheme.p3) },
    uPointer3D:    { value: new THREE.Vector3(0, 0, 0) },
    uHoverActive:  { value: 0 },
    uBurst:        { value: 0 }
  };

  const pMat = new THREE.ShaderMaterial({
    uniforms: pUniforms,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    vertexShader: `
      attribute float aSeed;
      attribute float aSize;
      attribute float aMix;
      uniform float uTime;
      uniform float uAudio;
      uniform float uPixelRatio;
      uniform vec3 uPointer3D;
      uniform float uHoverActive;
      uniform float uBurst;
      varying float vMix;
      varying float vAlpha;

      void main() {
        vec3 p = position;
        float dist0 = length(p);

        // Orbital curl + subtle breathing with voice energy
        float angle = uTime * (0.14 + 0.12 / (0.6 + dist0)) + aSeed * 0.05;
        float s = sin(angle * 0.35), c = cos(angle * 0.35);
        p.xz = mat2(c, -s, s, c) * p.xz;

        p.y += sin(uTime * 1.1 + aSeed) * 0.06;
        p += normalize(p + vec3(0.0001)) * (uAudio * 0.24 + uBurst * 0.38 / (0.6 + dist0));

        // Magnetic swirl around hovered 3D cursor spot
        vec3 toPtr = p - uPointer3D;
        float dPtr = length(toPtr);
        if (uHoverActive > 0.01 && dPtr < 1.35) {
          float push = (1.0 - dPtr / 1.35) * uHoverActive * 0.32;
          p += normalize(toPtr + vec3(0.001)) * push;
        }

        vec4 mvPosition = modelViewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mvPosition;
        gl_PointSize = aSize * uPixelRatio * (1.0 + uAudio * 0.9) * (6.8 / max(1.0, -mvPosition.z));
        vMix = aMix;
        vAlpha = (0.55 + 0.45 * sin(uTime * 2.2 + aSeed * 3.1)) * smoothstep(5.4, 0.9, dist0);
      }
    `,
    fragmentShader: `
      uniform vec3 uColorPrimary;
      uniform vec3 uColorAccent;
      uniform vec3 uColorCore;
      varying float vMix;
      varying float vAlpha;

      void main() {
        vec2 uv = gl_PointCoord - vec2(0.5);
        float d = length(uv);
        if (d > 0.5) discard;
        float soft = pow(1.0 - d * 2.0, 1.75);
        vec3 col = vMix < 0.55 ? uColorPrimary : (vMix < 0.88 ? uColorAccent : uColorCore);
        gl_FragColor = vec4(col, soft * clamp(vAlpha + 0.28, 0.0, 0.98));
      }
    `
  });
  const particleCloud = new THREE.Points(pGeo, pMat);
  holoRoot.add(particleCloud);

  // ==================== TACTILE POINTER / TOUCH / WHEEL INTERACTION ====================
  const raycaster = new THREE.Raycaster();
  const pointerNDC = new THREE.Vector2();
  let isDragging = false;
  let dragDistance = 0;
  let prevX = 0, prevY = 0;
  let rotVelX = 0.0014, rotVelY = 0.0042; // Gentle luxury spin velocity
  let targetHoverStrength = 0;
  let burstVal = 0;
  let lastTapTime = 0;

  function updatePointerRay(clientX, clientY) {
    pointerNDC.x = (clientX / window.innerWidth) * 2 - 1;
    pointerNDC.y = -(clientY / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(pointerNDC, camera);
    const hits = raycaster.intersectObject(hitCollider, false);
    if (hits.length > 0) {
      const localPt = holoRoot.worldToLocal(hits[0].point.clone());
      shellUniforms.uHoverPoint.value.copy(localPt);
      pUniforms.uPointer3D.value.copy(localPt);
      targetHoverStrength = 1.0;
      return localPt;
    }
    targetHoverStrength = 0.0;
    return null;
  }

  function triggerPulseAt(localPt, strong = false) {
    if (localPt) shellUniforms.uRippleOrigin.value.copy(localPt);
    else shellUniforms.uRippleOrigin.value.set(0, 0, 1);
    shellUniforms.uRippleTime.value = 0.0;
    shockAnim = 0.0;
    burstVal = strong ? 1.0 : 0.65;
  }

  canvas.addEventListener("pointerdown", (e) => {
    isDragging = true;
    dragDistance = 0;
    prevX = e.clientX;
    prevY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
    const pt = updatePointerRay(e.clientX, e.clientY);
    if (pt) triggerPulseAt(pt, false);
    $("orbHint").style.opacity = "0";
  });

  canvas.addEventListener("pointermove", (e) => {
    const pt = updatePointerRay(e.clientX, e.clientY);
    if (!isDragging) return;
    const dx = e.clientX - prevX;
    const dy = e.clientY - prevY;
    prevX = e.clientX;
    prevY = e.clientY;
    dragDistance += Math.hypot(dx, dy);
    rotVelY = dx * 0.0075;
    rotVelX = dy * 0.0075;
    holoRoot.rotation.y += rotVelY;
    holoRoot.rotation.x += rotVelX;
    if (pt && Math.random() < 0.14) burstVal = Math.max(burstVal, 0.25);
  });

  function endDrag(e) {
    if (!isDragging) return;
    isDragging = false;
    try { canvas.releasePointerCapture(e.pointerId); } catch (_) {}
    if (dragDistance < 6) {
      const pt = updatePointerRay(e.clientX, e.clientY);
      triggerPulseAt(pt, true);
      const now = performance.now();
      if (pt && now - lastTapTime < 340) {
        // Double-tap on orb toggles hands-free voice interaction once cleanly
        lastTapTime = 0;
        if (typeof startVoice === "function") startVoice();
      } else {
        lastTapTime = now;
      }
    }
  }
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);

  canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    targetCamZ = Math.max(2.7, Math.min(7.2, targetCamZ + e.deltaY * 0.0024));
    $("orbHint").style.opacity = "0";
  }, { passive: false });

  window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    const pr = Math.min(window.devicePixelRatio || 1, 2);
    renderer.setPixelRatio(pr);
    pUniforms.uPixelRatio.value = pr;
  });

  // Main Animation Loop
  let tPrev = performance.now();
  function animate(now) {
    requestAnimationFrame(animate);
    const dt = Math.min(0.05, (now - tPrev) * 0.001);
    tPrev = now;
    const t = now * 0.001;

    // Synchronized vocal waveform tracking: real backend 30Hz envelope or browser SpeechSynthesis cadence
    if (backendSpeakActive) {
      ttsSpeakWave += (backendSpeakLevel - ttsSpeakWave) * 0.52;
    } else if (browserSpeaking || orbState === "speaking") {
      const cadence = 0.42 + 0.28 * Math.abs(Math.sin(t * 13.5)) + 0.20 * Math.abs(Math.sin(t * 26.0));
      ttsSpeakWave = Math.max(ttsSpeakWave * Math.exp(-dt * 7.5), cadence);
    } else {
      ttsSpeakWave *= Math.exp(-dt * 11.0);
    }

    // Combine real mic FFT audioLevel + synchronized TARS vocal envelope
    let activeEnergy = Math.max(audioLevel, ttsSpeakWave);
    let speedMult = 1.0;
    if (orbState === "listening") { activeEnergy = Math.max(activeEnergy, 0.24); speedMult = 1.65; }
    else if (orbState === "thinking") { activeEnergy = Math.max(activeEnergy, 0.42 + 0.18 * Math.sin(t * 7)); speedMult = 3.2; }
    else if (orbState === "speaking") { speedMult = 2.0 + activeEnergy * 1.6; }
    else if (orbState === "error") { activeEnergy = 0.55; speedMult = 2.5; }

    // Smooth shader uniform interpolation
    shellUniforms.uTime.value = t;
    pUniforms.uTime.value = t;
    const smoothRate = backendSpeakActive ? 0.42 : 0.28;
    shellUniforms.uAudio.value += (activeEnergy - shellUniforms.uAudio.value) * smoothRate;
    pUniforms.uAudio.value = shellUniforms.uAudio.value;
    shellUniforms.uHoverStrength.value += (targetHoverStrength - shellUniforms.uHoverStrength.value) * 0.14;
    pUniforms.uHoverActive.value = shellUniforms.uHoverStrength.value;
    shellUniforms.uRippleTime.value = Math.min(99.0, shellUniforms.uRippleTime.value + dt);

    burstVal *= 0.90;
    pUniforms.uBurst.value = burstVal;

    // Dynamic palette lerp according to orb state or selected theme
    let targetPrimary = new THREE.Color(activeTheme.p1);
    let targetAccent  = new THREE.Color(activeTheme.p2);
    if (orbState === "thinking") {
      targetPrimary = new THREE.Color(0xffd166);
      targetAccent  = new THREE.Color(activeTheme.p1);
    } else if (orbState === "error") {
      targetPrimary = new THREE.Color(0xff5d7a);
      targetAccent  = new THREE.Color(0xff9f68);
    } else if (orbState === "listening") {
      targetPrimary = new THREE.Color(0x38f2ff);
      targetAccent  = new THREE.Color(activeTheme.p1);
    } else if (orbState === "speaking") {
      targetAccent = new THREE.Color(activeTheme.p3);
    }
    shellUniforms.uColorPrimary.value.lerp(targetPrimary, 0.10);
    shellUniforms.uColorAccent.value.lerp(targetAccent, 0.10);
    pUniforms.uColorPrimary.value.copy(shellUniforms.uColorPrimary.value);
    pUniforms.uColorAccent.value.copy(shellUniforms.uColorAccent.value);
    haloSprite.material.color.copy(shellUniforms.uColorPrimary.value);

    // Smooth camera spring zoom
    camera.position.z += (targetCamZ - camera.position.z) * 0.10;

    // Synchronized radial breathing of the orb when TARS or user speaks
    const syncedScale = 1.0 + shellUniforms.uAudio.value * 0.115 + burstVal * 0.025;
    holoRoot.scale.setScalar(syncedScale);
    haloSprite.scale.setScalar(4.3 + shellUniforms.uAudio.value * 0.95);

    // Inertia damping + serene idle rotation
    if (!isDragging) {
      holoRoot.rotation.y += rotVelY;
      holoRoot.rotation.x += rotVelX;
      rotVelY += (0.0036 * speedMult - rotVelY) * 0.045;
      rotVelX += (0.0009 * Math.sin(t * 0.4) - rotVelX) * 0.045;
    }

    // Counter-rotating internal wireframe globes & gyroscopic rings synchronized to voice
    innerLattice.rotation.y += 0.009 * speedMult;
    innerLattice.rotation.x -= 0.006 * speedMult;
    innerLattice.scale.setScalar(1.0 + shellUniforms.uAudio.value * 0.12);
    midCage.rotation.y -= 0.005 * speedMult;
    midCage.rotation.z += 0.003 * speedMult;
    midCage.scale.setScalar(1.0 + shellUniforms.uAudio.value * 0.08);
    flareBeam.scale.set(3.4 + shellUniforms.uAudio.value * 2.15, 0.22 + shellUniforms.uAudio.value * 0.26, 1);
    flareMat.opacity = 0.52 + shellUniforms.uAudio.value * 0.48;

    const corePulse = 0.85 + Math.sin(t * 3.4) * 0.08 + shellUniforms.uAudio.value * 1.05 + burstVal * 0.4;
    coreSprite.scale.set(corePulse, corePulse, 1);

    gyroRings.forEach((r, idx) => {
      r.grp.rotation.x += r.speed[0] * speedMult;
      r.grp.rotation.y += r.speed[1] * speedMult;
      r.grp.rotation.z += r.speed[2] * speedMult;
      const ringBeat = 1.0 + shellUniforms.uAudio.value * (0.065 + idx * 0.028);
      r.grp.scale.setScalar(ringBeat);
      r.grp.children[1].rotation.z += 0.04;
      const orbAngle = t * (1.2 + idx * 0.45) * (idx % 2 === 0 ? 1 : -1) * speedMult;
      const rad = r.grp.children[0].geometry.parameters.radius;
      r.grp.children[1].position.set(Math.cos(orbAngle) * rad, Math.sin(orbAngle) * rad, 0);
      r.mat.opacity = Math.min(0.96, r.baseOp + shellUniforms.uAudio.value * 0.42);
      r.mat.color.copy(idx % 2 === 0 ? shellUniforms.uColorPrimary.value : shellUniforms.uColorAccent.value);
    });

    // Feathered laser shockwave expansion animation
    if (shockAnim < 1.15) {
      shockAnim += dt * 1.65;
      const sc = 1.0 + shockAnim * 1.25;
      shockRing.scale.set(sc, sc, 1);
      shockUniforms.uColor.value.copy(shellUniforms.uColorPrimary.value);
      shockUniforms.uOpacity.value = Math.max(0, (1.0 - shockAnim / 1.15) * 0.85);
      shockRing.lookAt(camera.position);
    } else {
      shockUniforms.uOpacity.value = 0.0;
    }

    renderer.render(scene, camera);
  }
  requestAnimationFrame(animate);

  return {
    setTheme(key) {
      const th = THEMES[key] || THEMES.aqua;
      activeTheme = th;
      const r = document.documentElement.style;
      r.setProperty("--holo", th.primary);
      r.setProperty("--holo-rgb", th.rgb);
      r.setProperty("--holo-bright", th.bright);
      r.setProperty("--holo-bright-rgb", th.brightRgb);
      r.setProperty("--holo-sky", th.sky);
      r.setProperty("--bg-core", th.bgCore);
      innerLatticeMat.color.setHex(th.p3);
      midCageMat.color.setHex(th.p1);
      pUniforms.uColorCore.value.setHex(th.p3);
      triggerPulseAt(null, true);
    },
    pulse(strong = true) { triggerPulseAt(null, strong); },
    resetView() {
      targetCamZ = 4.45;
      holoRoot.rotation.set(0, 0, 0);
      rotVelX = 0.0014; rotVelY = 0.0042;
      triggerPulseAt(null, true);
    }
  };
})();

/* ==================== HOLOGRAM STATE & AUDIO REACTIVITY ==================== */
function setOrbState(nextState, labelText) {
  orbState = nextState;
  const chip = $("statusChip");
  const dot = $("stateDot");
  const lbl = $("stateLabel");
  if (labelText) {
    const t = String(labelText).trim();
    lbl.textContent = t.charAt(0).toUpperCase() + t.slice(1).toLowerCase();
  }
  const curText = (lbl.textContent || "").toUpperCase();
  const mutedState = (curText === "MUTED") || (nextState === "idle" && backendVoiceRuntime && !voiceOn);
  if (chip) {
    chip.classList.remove("state-idle", "state-listening", "state-thinking", "state-speaking", "state-error", "is-muted");
    chip.classList.add("state-" + nextState);
    if (mutedState) chip.classList.add("is-muted");
    chip.title = voiceOn ? "Listening — click to mute mic" : "Click to turn on mic";
  }
  if (dot) {
    if (mutedState) {
      dot.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M8.5 12h7" fill="none" stroke="#101418" stroke-width="2.5" stroke-linecap="round"/></svg>';
    } else if (nextState === "listening" || nextState === "speaking") {
      dot.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M8.5 9.6v4.8M12 7.2v9.6M15.5 9.6v4.8" fill="none" stroke="#061216" stroke-width="2.2" stroke-linecap="round"/></svg>';
    } else if (nextState === "thinking") {
      dot.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 2a10 10 0 0 1 0 20z" fill="currentColor"/></svg>';
    } else if (nextState === "error") {
      dot.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M9.1 9.1l5.8 5.8M14.9 9.1l-5.8 5.8" fill="none" stroke="#14090c" stroke-width="2.35" stroke-linecap="round"/></svg>';
    } else {
      dot.innerHTML = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M8.4 12.6l2.5 2.5 5-5.4" fill="none" stroke="#081214" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    }
  }
}

let micCtx = null, micAnalyser = null, micStream = null, micData = null, micRaf = null;
async function startMicSpectrum() {
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    micCtx = new AudioCtx();
    const src = micCtx.createMediaStreamSource(micStream);
    micAnalyser = micCtx.createAnalyser();
    micAnalyser.fftSize = 128;
    src.connect(micAnalyser);
    micData = new Uint8Array(micAnalyser.frequencyBinCount);
    const loop = () => {
      if (!micAnalyser) return;
      micAnalyser.getByteFrequencyData(micData);
      let sum = 0;
      for (let i = 0; i < micData.length; i++) sum += micData[i];
      const norm = Math.min(1.0, (sum / micData.length) / 95.0);
      audioLevel += (norm - audioLevel) * 0.35;
      if ($("audioMeter")) $("audioMeter").textContent = audioLevel > 0.08 ? `ACTIVE ${(audioLevel * 100).toFixed(0)}%` : "LISTENING";
      micRaf = requestAnimationFrame(loop);
    };
    loop();
  } catch (_) {}
}
function stopMicSpectrum() {
  if (micRaf) cancelAnimationFrame(micRaf);
  micRaf = null; micAnalyser = null; audioLevel = 0;
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (micCtx) { try { micCtx.close(); } catch (_) {} micCtx = null; }
  if ($("audioMeter")) $("audioMeter").textContent = "IDLE";
}

/* ==================== SUBTITLE CHAT & DRAWER INSPECTOR ==================== */
function addMsg(role, text, meta) {
  const el = document.createElement("div");
  el.className = "sub-line " + role;
  const tag = meta ? meta : (role === "user" ? "YOU" : "TARS");
  el.innerHTML = `<span class="sub-tag">[${esc(tag)}]</span>${esc(text)}`;
  $("chat").appendChild(el);
  while ($("chat").children.length > 24) $("chat").removeChild($("chat").firstChild);
  $("chat").scrollTop = $("chat").scrollHeight;
}

function openDrawer(tabName) {
  $("inspectorDrawer").classList.add("open");
  $("drawerToggleBtn").classList.add("active");
  if (tabName) switchDrawerTab(tabName);
}
function closeDrawer() {
  $("inspectorDrawer").classList.remove("open");
  $("drawerToggleBtn").classList.remove("active");
}
function switchDrawerTab(tabName) {
  document.querySelectorAll(".tab-pill").forEach(b => b.classList.toggle("active", b.dataset.tab === tabName));
  ["providers", "history", "prefs", "reminders", "tools", "screen"].forEach(t => {
    const node = $("tab-" + t);
    if (node) node.style.display = (t === tabName) ? "block" : "none";
  });
}

/* ==================== BACKEND API WIRING ==================== */
async function refreshStatus() {
  try {
    const r = await fetch("/api/status");
    const j = await r.json();
    const micInfo = j.mic || {};
    backendVoiceRuntime = !!micInfo.runtime_active;
    if (backendVoiceRuntime && (performance.now() - lastMicMutationAt) >= 1800) {
      const wantOn = !micInfo.muted;
      if (!micSyncedOnce || voiceOn !== wantOn) {
        micSyncedOnce = true;
        voiceOn = wantOn;
        paintMic();
      }
    }
    const voiceInfo = j.voice || {};
    if (voiceInfo.speaking) {
      backendSpeakActive = true;
      backendSpeakLevel = Number(voiceInfo.level || 0.65);
      if (orbState !== "speaking") setOrbState("speaking", "Speaking");
    } else if (backendSpeakActive) {
      backendSpeakActive = false;
      backendSpeakLevel = 0.0;
    }
    if (!backendSpeakActive && !browserSpeaking) {
      if (orbState === "idle" || orbState === "speaking") {
        setOrbState(voiceOn ? "listening" : "idle", voiceOn ? "LISTENING" : (backendVoiceRuntime ? "MUTED" : "ONLINE"));
      } else if (orbState === "listening" && !voiceOn) {
        setOrbState("idle", backendVoiceRuntime ? "MUTED" : "ONLINE");
      }
    }
    $("clock").textContent = (j.time || "--").split(" ").pop();
    const t = j.telemetry || {};
    const cpuVal = t.cpu_load_percent != null ? t.cpu_load_percent : null;
    const ramVal = t.ram_usage_percent != null ? t.ram_usage_percent : null;
    $("cpu").textContent = cpuVal != null ? cpuVal + "%" : "--";
    $("cpuBar").style.width = (cpuVal != null ? Math.min(100, cpuVal) : 0) + "%";
    $("ram").textContent = ramVal != null ? ramVal + "%" : "--";
    $("ramBar").style.width = (ramVal != null ? Math.min(100, ramVal) : 0) + "%";
    $("disk").textContent = t.disk_free_gb != null ? t.disk_free_gb + " GB" : "--";
    $("battery").textContent = t.battery || "--";
    if ($("cwd")) $("cwd").textContent = j.cwd || "--";
    const llm = j.llm || {};
    if ($("llmName")) $("llmName").textContent = llm.model || "n/a";
    if ($("llmState")) $("llmState").textContent = llm.available ? "AVAILABLE" : "OFFLINE/LOCAL";
    const p = j.personality || {};
    if ($("honesty")) $("honesty").textContent = p.honesty != null ? p.honesty + "%" : "--";
    if ($("humor")) $("humor").textContent = p.humor != null ? p.humor + "%" : "--";
    if ($("sarcasm")) $("sarcasm").textContent = p.sarcasm != null ? p.sarcasm + "%" : "--";
  } catch (_) {
    setOrbState("error", "OFFLINE");
  }
}

async function refreshToolCount() {
  if (!$("toolCount")) return;
  try {
    const j = await (await fetch("/api/tools")).json();
    $("toolCount").textContent = j.count || "--";
  } catch (_) { $("toolCount").textContent = "--"; }
}

async function refreshProviders() {
  try {
    const j = await (await fetch("/api/providers")).json();
    const items = j.providers || [];
    const cur = j.current || {};
    if (!items.length) { $("tab-providers").innerHTML = '<div style="color:var(--muted)">No providers configured.</div>'; return; }
    $("tab-providers").innerHTML = items.map(p => {
      const prov = p.provider || p.name || "?";
      const isCur = prov === cur.provider;
      const dot = `<span class="diag-dot ${p.available ? "ok" : "fail"}" style="display:inline-block;margin-right:8px;"></span>`;
      const btn = isCur
        ? `<span class="provider-switch active">ACTIVE</span>`
        : (p.available ? `<button class="provider-switch holo-btn" data-provider="${esc(prov)}" data-model="${esc(p.model || "")}"><span>SWITCH</span></button>` : `<span style="color:var(--muted);font-size:10px;">UNAVAILABLE</span>`);
      return `<div class="drawer-row"><div>${dot}<b>${esc(prov.toUpperCase())}</b><div style="color:var(--muted);font-size:10.5px;">${esc(p.model || "n/a")}</div></div>${btn}</div>`;
    }).join("");
  } catch (_) { $("tab-providers").textContent = "Unavailable"; }
}

async function switchProvider(name, model) {
  try {
    const r = await fetch("/api/switch-provider", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ provider: name, model: model || null })
    });
    const j = await r.json();
    if (j.success) {
      addMsg("assistant", `Switched neural backend to ${name} (${j.model || model || "default"}).`, "SYSTEM");
      HoloEngine.pulse(true);
    } else {
      addMsg("assistant", `Provider switch failed: ${j.error || "unknown"}`, "ERROR");
    }
    refreshProviders(); refreshStatus();
  } catch (_) { addMsg("assistant", "Network error switching provider.", "ERROR"); }
}

async function refreshReminders() {
  try {
    const j = await (await fetch("/api/reminders")).json();
    const items = j.items || [];
    if (!items.length) {
      if ($("rightReminders")) $("rightReminders").textContent = "None queued";
      $("tab-reminders").innerHTML = '<div style="color:var(--muted)">No upcoming reminders.</div>';
      return;
    }
    if ($("rightReminders")) $("rightReminders").innerHTML = items.slice(0, 3).map(r => `<div>• ${esc((r.message || "").slice(0, 28))}</div>`).join("");
    $("tab-reminders").innerHTML = items.map(r => `<div class="drawer-row"><div><b style="color:var(--amber)">${esc(r.due_time || "")}</b><div>${esc(r.message || "")}</div></div></div>`).join("");
  } catch (_) { $("tab-reminders").textContent = "Unavailable"; }
}

async function refreshPrefs() {
  try {
    const j = await (await fetch("/api/preferences")).json();
    const items = (j.items || []).slice(0, 15);
    if (!items.length) { $("tab-prefs").innerHTML = '<div style="color:var(--muted)">No stored facts.</div>'; return; }
    $("tab-prefs").innerHTML = items.map(r => `<div class="drawer-row"><b>${esc(r.key)}</b><span style="color:var(--muted)">${esc(typeof r.value === "string" ? r.value : JSON.stringify(r.value))}</span></div>`).join("");
  } catch (_) { $("tab-prefs").textContent = "Unavailable"; }
}

async function refreshHistory() {
  try {
    const j = await (await fetch("/api/history?limit=20")).json();
    const items = j.items || [];
    if (!items.length) { $("tab-history").innerHTML = '<div style="color:var(--muted)">No history yet.</div>'; return; }
    $("tab-history").innerHTML = items.slice(-20).map(m => {
      const role = m.role === "user" ? "YOU" : "TARS";
      const txt = (m.content || "").slice(0, 140);
      return `<div class="drawer-row" style="display:block;"><b style="color:var(--holo)">${role}</b> · ${esc(txt)}${(m.content || "").length > 140 ? "…" : ""}</div>`;
    }).join("");
  } catch (_) { $("tab-history").textContent = "Unavailable"; }
}

async function refreshToolLogs() {
  try {
    const j = await (await fetch("/api/tool-logs?limit=20")).json();
    const items = j.items || [];
    if (!items.length) {
      if ($("leftToolsFeed")) $("leftToolsFeed").innerHTML = '<div class="diag-line"><span class="diag-dot"></span><span class="diag-k">Awaiting tool call</span></div>';
      $("tab-tools").innerHTML = '<div style="color:var(--muted)">No tool calls logged.</div>';
      return;
    }
    if ($("leftToolsFeed")) {
      $("leftToolsFeed").innerHTML = items.slice(0, 9).map(it => {
        if (it.raw) return `<div class="diag-line"><span class="diag-dot"></span><span>${esc(it.raw.slice(0, 28))}</span></div>`;
        const ok = it.result && it.result.success === false ? "fail" : "ok";
        const nm = String(it.tool_name || "?").replace(/_/g, " ").toUpperCase();
        return `<div class="diag-line" title="${esc(it.datetime || "")}"><span class="diag-dot ${ok}"></span><span>${esc(nm)}</span></div>`;
      }).join("");
    }
    $("tab-tools").innerHTML = items.map(it => {
      if (it.raw) return `<div class="drawer-row">${esc(it.raw)}</div>`;
      const ok = it.result && it.result.success === false ? "fail" : "ok";
      return `<div class="drawer-row"><span><span class="diag-dot ${ok}" style="display:inline-block;margin-right:8px;"></span>${esc(it.tool_name || "?")}</span><span style="color:var(--muted);font-size:10px;">${esc(it.datetime || "")}</span></div>`;
    }).join("");
  } catch (_) {}
}

let confirmPollTimer = null;
async function pollPendingConfirm() {
  try {
    const j = await (await fetch("/api/confirm/pending")).json();
    const pend = j.pending;
    if (pend) {
      const argsStr = JSON.stringify(pend.arguments || {}).slice(0, 180);
      $("confirmDesc").textContent = `Execute tool "${pend.tool}" with arguments ${argsStr}?`;
      $("confirmModal").classList.add("open");
    } else {
      $("confirmModal").classList.remove("open");
    }
  } catch (_) {}
}

async function sendConfirm(approved) {
  $("confirmModal").classList.remove("open");
  try {
    await fetch("/api/confirm", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ approved })
    });
  } catch (_) {}
}

async function cancelTask() {
  try {
    const j = await (await fetch("/api/cancel-task", { method: "POST" })).json();
    addMsg("assistant", j.message || "Task cancelled.", "SYSTEM");
    setOrbState("idle", "ONLINE");
    HoloEngine.pulse(true);
  } catch (_) { addMsg("assistant", "Could not cancel task.", "ERROR"); }
}

async function sendPrompt() {
  const input = $("prompt");
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  $("send").disabled = true;
  addMsg("user", text, "YOU");
  setOrbState("thinking", "PROCESSING");
  HoloEngine.pulse(true);

  if (confirmPollTimer) clearInterval(confirmPollTimer);
  confirmPollTimer = setInterval(pollPendingConfirm, 500);

  try {
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt: text })
    });
    const j = await r.json();
    if (!r.ok) {
      setOrbState("error", "FAULT");
      addMsg("assistant", j.detail || "Request failed", "ERROR");
      setTimeout(() => setOrbState(voiceOn ? "listening" : "idle", voiceOn ? "LISTENING" : "ONLINE"), 1400);
    } else {
      const meta = `TARS · ${j.duration_sec || 0}s` + (j.steps && j.steps.length ? ` · ${j.steps.length} STEP(S)` : "");
      addMsg("assistant", j.response || "(no response)", meta);
      HoloEngine.pulse(true);
      speak(j.response || "");
    }
  } catch (e) {
    setOrbState("error", "NET FAULT");
    addMsg("assistant", "Network error: " + e, "ERROR");
    setTimeout(() => setOrbState(voiceOn ? "listening" : "idle", voiceOn ? "LISTENING" : "ONLINE"), 1400);
  } finally {
    if (confirmPollTimer) { clearInterval(confirmPollTimer); confirmPollTimer = null; }
    $("confirmModal").classList.remove("open");
    $("send").disabled = false;
    refreshHistory(); refreshToolLogs(); refreshReminders(); refreshStatus(); refreshProviders();
  }
}

/* ==================== VOICE INTERACTION & SYNCED SPEECH REACTIVITY ==================== */
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
let voiceOn = false, voiceReplies = true, recognition = null, speakWatchTimer = null, cachedVoices = [];
let backendVoiceRuntime = false, micSyncedOnce = false, lastMicMutationAt = 0;

async function pushMicMute(muted) {
  lastMicMutationAt = performance.now();
  try {
    const r = await fetch("/api/mic", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ muted: !!muted })
    });
    const j = await r.json();
    if (j && typeof j.runtime_active === "boolean") {
      backendVoiceRuntime = j.runtime_active;
    }
  } catch (_) {}
}

function refreshVoicesCache() {
  if ("speechSynthesis" in window) {
    cachedVoices = window.speechSynthesis.getVoices() || [];
  }
}
refreshVoicesCache();
if ("speechSynthesis" in window && typeof window.speechSynthesis.onvoiceschanged !== "undefined") {
  window.speechSynthesis.onvoiceschanged = refreshVoicesCache;
}

function pickFemaleBrowserVoice() {
  if (!cachedVoices.length) refreshVoicesCache();
  const voices = cachedVoices || [];
  const female = voices.find(v => /zira|jenny|aria|hazel|samantha|heera|female|google us english/i.test(v.name) && !/david|mark|george|guy|male/i.test(v.name));
  return female || voices.find(v => /en/i.test(v.lang) && !/david|mark|george|guy|male/i.test(v.name)) || null;
}

function speak(text) {
  if (!voiceReplies || !text || !("speechSynthesis" in window)) {
    setOrbState(voiceOn ? "listening" : "idle", voiceOn ? "LISTENING" : "ONLINE");
    return;
  }
  try {
    window.speechSynthesis.cancel();
    if (speakWatchTimer) { clearInterval(speakWatchTimer); speakWatchTimer = null; }

    const clean = String(text).slice(0, 600);
    const u = new SpeechSynthesisUtterance(clean);
    u.lang = "en-US"; u.rate = 1.05;
    const fv = pickFemaleBrowserVoice();
    if (fv) u.voice = fv;

    let ended = false;
    const finishSpeak = () => {
      if (ended) return;
      ended = true;
      browserSpeaking = false;
      if (speakWatchTimer) { clearInterval(speakWatchTimer); speakWatchTimer = null; }
      if (!backendSpeakActive) {
        ttsSpeakWave = 0.0;
        if ($("audioMeter")) $("audioMeter").textContent = voiceOn ? "LISTENING" : "IDLE";
        setOrbState(voiceOn ? "listening" : "idle", voiceOn ? "LISTENING" : (backendVoiceRuntime ? "MUTED" : "ONLINE"));
      }
    };

    // Wait for u.onstart before driving speaking orb animation so waves match spoken onset
    u.onstart = () => {
      browserSpeaking = true;
      setOrbState("speaking", "Speaking");
      ttsSpeakWave = 0.65;
      if ($("audioMeter")) $("audioMeter").textContent = "SPEAKING · SYNC";
      HoloEngine.pulse(false);
    };

    // Real-time word-boundary synchronization: spike wave + subtle orbital ripple per spoken word
    let wordCounter = 0;
    u.onboundary = (ev) => {
      if (ev && ev.name && ev.name !== "word") return;
      const wLen = Math.max(2, Math.min(12, ev.charLength || 5));
      ttsSpeakWave = Math.min(1.0, 0.58 + wLen * 0.042);
      if ($("audioMeter")) $("audioMeter").textContent = `SPEAKING · ${Math.round(ttsSpeakWave * 100)}%`;
      wordCounter++;
      if (wordCounter % 4 === 1) HoloEngine.pulse(false);
    };

    u.onend = finishSpeak;
    u.onerror = finishSpeak;
    window.speechSynthesis.speak(u);

    // Watchdog in case browser speechSynthesis stalls or ends without firing onend
    const maxWaitMs = Math.max(2500, clean.length * 95 + 1500);
    const startedMs = performance.now();
    speakWatchTimer = setInterval(() => {
      const elap = performance.now() - startedMs;
      if (elap > maxWaitMs || (elap > 450 && !window.speechSynthesis.speaking && !window.speechSynthesis.pending)) {
        finishSpeak();
      }
    }, 180);
  } catch (_) {
    browserSpeaking = false;
    ttsSpeakWave = 0.0;
    setOrbState(voiceOn ? "listening" : "idle", voiceOn ? "LISTENING" : (backendVoiceRuntime ? "MUTED" : "ONLINE"));
  }
}

function paintMic() {
  $("mic").classList.toggle("listening", voiceOn);
  $("mic").title = voiceOn ? "Mute microphone" : "Enable microphone listening";
}

function stopVoice() {
  voiceOn = false;
  paintMic();
  stopMicSpectrum();
  if (recognition) {
    const rec = recognition;
    recognition = null;
    rec.onresult = null;
    rec.onerror = null;
    rec.onend = null;
    try { rec.abort(); } catch (_) { try { rec.stop(); } catch (_) {} }
  }
  $("prompt").placeholder = backendVoiceRuntime
    ? "Microphone muted — click mic or double-tap orb to resume…"
    : "Speak to TARS or type a command…";
  setOrbState("idle", backendVoiceRuntime ? "MUTED" : "ONLINE");
  pushMicMute(true);
}

function startVoice() {
  if (voiceOn) { stopVoice(); return; }
  voiceOn = true;
  paintMic();
  setOrbState("listening", "LISTENING");
  $("prompt").placeholder = "🎙 Listening…";
  HoloEngine.pulse(true);
  pushMicMute(false);
  startMicSpectrum();

  // When main.py's terminal voice loop is running, it owns STT directly so browser SpeechRecognition
  // does not fire duplicate commands or hit Brave network SpeechRecognition blocks.
  if (backendVoiceRuntime) return;

  if (!SpeechRecognitionAPI) {
    addMsg("assistant", "Browser Speech Recognition requires Chrome or Edge. You can type commands cleanly below.", "VOICE");
    stopVoice();
    return;
  }
  const rec = new SpeechRecognitionAPI();
  recognition = rec;
  rec.lang = "en-US";
  rec.continuous = true;
  rec.interimResults = true;
  rec.onresult = (ev) => {
    if (!voiceOn || recognition !== rec) return;
    let interim = "", finalText = "";
    for (let i = ev.resultIndex; i < ev.results.length; i++) {
      const t = ev.results[i][0].transcript;
      if (ev.results[i].isFinal) finalText += t; else interim += t;
    }
    if (interim) $("prompt").placeholder = "🎙 " + interim;
    if (finalText.trim()) {
      $("prompt").value = finalText.trim();
      sendPrompt();
    }
  };
  rec.onerror = (e) => {
    if (!voiceOn || recognition !== rec) return;
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      addMsg("assistant", "Microphone permission denied. Enable microphone access and retry.", "VOICE");
      stopVoice();
    } else if (e.error === "network" || e.error === "audio-capture") {
      addMsg("assistant", "Browser speech service unavailable (" + e.error + "). Use python main.py voice mode or type below.", "VOICE");
      stopVoice();
    }
  };
  rec.onend = () => {
    if (voiceOn && recognition === rec) {
      try { rec.start(); } catch (_) { stopVoice(); }
    } else {
      paintMic();
    }
  };
  try { rec.start(); } catch (_) { stopVoice(); }
}

function toggleAudioOut() {
  voiceReplies = !voiceReplies;
  $("spk").classList.toggle("muted", !voiceReplies);
  $("spk").title = voiceReplies ? "Mute spoken replies" : "Enable spoken replies";
  if (!voiceReplies && "speechSynthesis" in window) {
    window.speechSynthesis.cancel();
    browserSpeaking = false;
    if (!backendSpeakActive) {
      ttsSpeakWave = 0.0;
      if (orbState === "speaking") setOrbState(voiceOn ? "listening" : "idle", voiceOn ? "LISTENING" : (backendVoiceRuntime ? "MUTED" : "ONLINE"));
    }
  }
}

/* ==================== REACTIVE BUTTON RIPPLE & SPOTLIGHT ==================== */
document.addEventListener("pointermove", (e) => {
  const btn = e.target.closest(".holo-btn");
  if (!btn) return;
  const rect = btn.getBoundingClientRect();
  btn.style.setProperty("--mx", (e.clientX - rect.left) + "px");
  btn.style.setProperty("--my", (e.clientY - rect.top) + "px");
});

document.addEventListener("pointerdown", (e) => {
  const btn = e.target.closest(".holo-btn");
  if (!btn || btn.disabled) return;
  const rect = btn.getBoundingClientRect();
  const wave = document.createElement("span");
  wave.className = "btn-wave";
  const sz = Math.max(rect.width, rect.height);
  wave.style.width = sz + "px";
  wave.style.height = sz + "px";
  wave.style.left = (e.clientX - rect.left) + "px";
  wave.style.top = (e.clientY - rect.top) + "px";
  btn.appendChild(wave);
  setTimeout(() => wave.remove(), 580);
  HoloEngine.pulse(false);
});

/* ==================== UI EVENT HOOKS ==================== */
$("statusChip").addEventListener("click", startVoice);
$("mic").addEventListener("click", startVoice);
$("spk").addEventListener("click", toggleAudioOut);
$("send").addEventListener("click", sendPrompt);
$("prompt").addEventListener("keydown", (e) => { if (e.key === "Enter") sendPrompt(); });
$("cancelBtn").addEventListener("click", cancelTask);
$("drawerResetBtn").addEventListener("click", () => HoloEngine.resetView());
$("drawerToggleBtn").addEventListener("click", () => {
  if ($("inspectorDrawer").classList.contains("open")) closeDrawer();
  else openDrawer("providers");
});
$("drawerCloseBtn").addEventListener("click", closeDrawer);

document.querySelectorAll(".tab-pill").forEach(btn => {

});
$("tab-providers").addEventListener("click", (e) => {
  const btn = e.target.closest("button.provider-switch");

$("refreshShotBtn").addEventListener("click", () => {

});

document.querySelectorAll(".swatch").forEach(s => {

    document.querySelectorAll(".swatch").forEach(x => x.classList.remove("active"));
    s.classList.add("active");
    HoloEngine.setTheme(s.dataset.theme);
  });
});

$("confirmApproveBtn").addEventListener("click", () => sendConfirm(true));
$("confirmDenyBtn").addEventListener("click", () => sendConfirm(false));

// Initialize holographic HUD feed & live 1s clock
function tickClock() {
  const now = new Date();
  $("clock").textContent = now.toLocaleTimeString("en-GB", { hour12: false });
}
// Real-time 50Hz backend voice telemetry stream so 3D orb syncs strictly to audio playback
let voiceWs = null;
let speakOnsetPulsed = false;
function connectVoiceStream() {
  if (!("WebSocket" in window) || !location.host) return;
  try {
    const proto = location.protocol === "https:" ? "wss:" : "ws:";
    const ws = new WebSocket(`${proto}//${location.host}/ws/voice`);
    voiceWs = ws;
    ws.onmessage = (ev) => {
      try {
        const d = JSON.parse(ev.data);
        backendVoiceRuntime = !!d.runtime_active;
        if (backendVoiceRuntime && (performance.now() - lastMicMutationAt) >= 1800) {
          const wantOn = !d.muted;
          if (!micSyncedOnce || voiceOn !== wantOn) {
            micSyncedOnce = true;
            voiceOn = wantOn;
            paintMic();
          }
        }
        const wasSpeaking = backendSpeakActive;
        backendSpeakActive = !!d.speaking;
        const rawLevel = d.level != null ? Math.max(0.0, Math.min(1.0, Number(d.level))) : 0.0;
        backendSpeakLevel = backendSpeakActive ? rawLevel : 0.0;
        if (backendSpeakActive) {
          if (!wasSpeaking) {
            speakOnsetPulsed = false;
            setOrbState("speaking", "Speaking");
          }
          if (!speakOnsetPulsed && backendSpeakLevel >= 0.25) {
            speakOnsetPulsed = true;
            HoloEngine.pulse(false);
          }
        } else if (wasSpeaking && !browserSpeaking) {
          speakOnsetPulsed = false;
          setOrbState(voiceOn ? "listening" : "idle", voiceOn ? "Listening" : (backendVoiceRuntime ? "Muted" : "Online"));
        }
      } catch (_) {}
    };
    ws.onclose = () => {
      if (voiceWs === ws) voiceWs = null;
      setTimeout(connectVoiceStream, 1200);
    };
    ws.onerror = () => { try { ws.close(); } catch (_) {} };
  } catch (_) {}
}

tickClock();
setInterval(tickClock, 1000);
addMsg("assistant", "Holographic neural interface online. Drag orb to inspect, scroll to zoom, tap to pulse, or double-tap core to speak.", "TARS");
connectVoiceStream();
refreshStatus(); refreshProviders(); refreshToolCount(); refreshReminders(); refreshPrefs(); refreshHistory(); refreshToolLogs();
setInterval(refreshStatus, 4500);
setInterval(() => { refreshReminders(); refreshHistory(); refreshToolLogs(); refreshProviders(); }, 10000);
</script>
